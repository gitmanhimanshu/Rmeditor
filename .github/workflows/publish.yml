name: Publish to PyPI

# Publishes to PyPI on a GitHub Release, or when a version tag (v*) is pushed.
# PyPI rejects re-uploading an existing version, so bump the version in
# pyproject.toml (and CHANGELOG.md) before each release/tag.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC) — no token needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
