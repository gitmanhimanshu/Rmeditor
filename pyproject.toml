[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-rmeditor"
version = "0.1.6"
description = "A lightweight, self-hosted, HTML-output rich text editor widget for Django. No CDN, no API key, no branding, no usage limits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Himanshu", email = "himanshuyada70@gmail.com" }]
keywords = [
    "django", "rich text", "editor", "wysiwyg", "html",
    "contenteditable", "tinymce alternative", "self hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors",
]
dependencies = ["Django>=3.2"]

[project.urls]
Homepage = "https://github.com/gitmanhimanshu/Rmeditor"
Repository = "https://github.com/gitmanhimanshu/Rmeditor"
Issues = "https://github.com/gitmanhimanshu/Rmeditor/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rmeditor = [
    "static/rmeditor/css/*.css",
    "static/rmeditor/js/*.js",
    "templates/rmeditor/*.html",
]
